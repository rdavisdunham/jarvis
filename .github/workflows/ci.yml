name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Synthetic CI database only. Never add deployment or model-provider secrets here.
  JARVIS_DATABASE_URL: postgresql+psycopg://jarvis:ci-only@127.0.0.1:5432/jarvis_ci
  JARVIS_ENV_FILE: ""
  PYTHONUNBUFFERED: "1"
  UV_LOCKED: "true"

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Keep the major/patch in sync with compose.upgrade.yml.
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jarvis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python dependencies
        run: uv sync --locked --group dev
      - name: Check Python correctness
        run: uv run --no-sync ruff check --select E9,F63,F7,F82,F811 apps/api/jarvis tests scripts/validate_custom_planner.py
      - name: Validate app eval catalog and graders (no paid inference)
        run: |
          uv run --no-sync ruff check --select E9,F63,F7,F82,F811 scripts/app_eval evals
          uv run --no-sync python -m scripts.app_eval.runner validate
          uv run --no-sync python -m scripts.app_eval.runner plan --mode offline --output artifacts/ci/eval-plan.json
          # Ratchet: fails if fully bound cases drop below the committed baseline or a bound case becomes unbound.
          uv run --no-sync python -m scripts.app_eval.runner coverage --output artifacts/ci/eval-coverage.json --baseline evals/app/automation-coverage.json
          uv run --no-sync python -m pytest -q evals --tb=short
      - name: Apply migrations to an empty database
        run: uv run --no-sync alembic upgrade head
      - name: Check migration/model agreement
        run: uv run --no-sync alembic check
      - name: Run backend regression suite
        run: uv run --no-sync pytest -q --tb=short --junitxml=artifacts/ci/backend.xml
      - name: Keep failed test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-report
          path: artifacts/ci/backend.xml
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Frontend and browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: jarvis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: |
          uv sync --locked --group dev
          npm ci --prefix apps/web --no-audit --no-fund
      - name: Run frontend tests
        working-directory: apps/web
        run: npm test
      - name: Type-check and build frontend
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated desktop/mobile browser acceptance
        env:
          PYTHONPATH: apps/api
          JARVIS_WORKER_ENABLED: "false"
          JARVIS_EXTERNAL_SERVICES_ENABLED: "false"
        run: uv run --no-sync python scripts/validate_custom_planner.py
      - name: Keep failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-artifacts
          path: |
            artifacts/custom-planner/
            artifacts/chat-activity/
            artifacts/semantic-search/
            artifacts/note-lists/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so gitleaks scans every commit, not just the merge ref.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Audit locked Python dependencies (pip-audit)
        run: |
          mkdir -p artifacts/ci
          uv export --frozen --all-groups --no-emit-project --format requirements-txt > artifacts/ci/requirements-audit.txt
          uvx pip-audit==2.9.0 --disable-pip --progress-spinner off -r artifacts/ci/requirements-audit.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Audit production npm dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
