services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - STT_PROVIDER=${STT_PROVIDER:-groq}
      - WHISPER_MODEL=${WHISPER_MODEL:-medium.en}
      - USE_LOCAL_WHISPER=${USE_LOCAL_WHISPER:-false}
      - JARVIS_SYSTEM_PROMPT=${JARVIS_SYSTEM_PROMPT:-}
      - TTS_PROVIDER=${TTS_PROVIDER:-groq}
      - TTS_ORPHEUS_VOICE=${TTS_ORPHEUS_VOICE:-autumn}
      - TTS_ORPHEUS_SPEED=${TTS_ORPHEUS_SPEED:-1.0}
      - TTS_KOKORO_VOICE=${TTS_KOKORO_VOICE:-af_heart}
      - TTS_KOKORO_SPEED=${TTS_KOKORO_SPEED:-1.0}
      - TTS_KOKORO_LANG=${TTS_KOKORO_LANG:-a}
      - HF_TOKEN=${HF_TOKEN}
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
      - MEMORY_DEVICE=${MEMORY_DEVICE:-cuda}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MEMORY_SEARCH_THRESHOLD=${MEMORY_SEARCH_THRESHOLD:-0.5}
      - MEMORY_SEARCH_LIMIT_USER=${MEMORY_SEARCH_LIMIT_USER:-10}
      - MEMORY_SEARCH_LIMIT_JARVIS=${MEMORY_SEARCH_LIMIT_JARVIS:-10}
      - MEMORY_LLM_MODEL=${MEMORY_LLM_MODEL:-llama-3.3-70b-versatile}
      - EOU_ENABLED=${EOU_ENABLED:-false}
      - EOU_THRESHOLD=${EOU_THRESHOLD:-0.5}
      - ORT_LOG_LEVEL=ERROR
    volumes:
      - backend-uploads:/app/audio-server/uploads
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build:
      context: ./client
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=WARN
    restart: unless-stopped

volumes:
  backend-uploads:
  qdrant_data:
