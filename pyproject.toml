[project]
name = "jarvis-core"
version = "0.1.0"
description = "Durable personal services for Jarvis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "httpx>=0.28,<1", "websockets>=15,<17",
  "dbos>=2,<3", "python-dateutil>=2.9,<3", "pywebpush>=2,<3",
  "cryptography>=44", "python-multipart>=0.0.20",
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.26",
    "ruff>=0.11",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["apps/api/jarvis"]
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 110
target-version = "py312"
